name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom
        ports:
          # Formato HOST:CONTAINER. Postgres escucha en 5432 dentro del
          # contenedor; el 5433 es el que prisma.config.ts usa por defecto.
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, la misma version con la que se desarrolla.
          # No bajar de 22.19: jsdom 30 tira de undici 8, que exige >=22.19.0.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El cliente de Prisma se genera, no se versiona (está en .gitignore).
      # Sin este paso, typecheck falla con "Cannot find module generated/prisma/client".
      - name: Generar el cliente de Prisma
        run: npm run prisma:generate --workspace=server

      # La base del servicio postgres arranca vacía: sin este paso, cualquier
      # test de integración falla con "relation does not exist". No hace falta
      # DATABASE_URL: prisma.config.ts cae por defecto en localhost:5433, que
      # es el puerto del host publicado arriba.
      - name: Preparar la base de datos
        run: npm run prisma:deploy --workspace=server

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      # Los pasos de paquetes delegan en los scripts de la raíz, que ya usan
      # --workspaces --if-present. Así la CI empieza a probar server/ y client/
      # en cuanto tengan script, sin volver a editar este archivo.
      - name: Pruebas
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
